name: Document PDF theme selector update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          new_section = '''## 8. سیستم ۱۵ حالت رنگی PDF

در `assets/js/main.js` یک لایهٔ ورودی کوچک وجود دارد که `main-legacy.js` را اجرا می‌کند و selector مربوط به themeهای PDF را برای رابط جدید تنظیم می‌کند. ۱۵ گزینه شامل ۱۴ دسته‌بندی نام‌دار مطابق PDF مرجع و یک حالت «بدون دسته‌بندی» است.

ترتیب نمایش selector به این صورت است:

1. بدون دسته‌بندی / Uncategorized — حالت پیش‌فرض
2. جرم اتمی / Atomic Mass (Physical)
3. چگالی / Density (Physical)
4. حالت استاندارد / Standard State (Physical)
5. نقطه ذوب / Melting Point (Physical)
6. نقطه جوش / Boiling Point (Physical)
7. شعاع اتمی / Atomic Radius (Atomic)
8. آرایش الکترونی / Electron Configuration (Atomic)
9. انرژی یونش / Ionization Energy (Atomic)
10. الکترون‌خواهی / Electron Affinity (Atomic)
11. الکترونگاتیویته / Electronegativity (Chemical)
12. حالت‌های اکسایش / Oxidation States (Chemical)
13. فلز / شبه‌فلز / نافلز / Metal / Metalloid / Nonmetal (Classification)
14. گروه / خانواده شیمیایی / Chemical Group / Family (Classification)
15. سال کشف / Year Discovered (History)

برچسب داخل پرانتز فقط نوع دسته‌بندی را مشخص می‌کند و ساختار یک selector واحد را حفظ می‌کند؛ منوی جداگانه‌ای برای گروه‌های اصلی وجود ندارد.

در هر بار بارگذاری یا refresh صفحه، «بدون دسته‌بندی» به‌عنوان حالت پیش‌فرض انتخاب می‌شود. انتخاب کاربر پس از آن همچنان می‌تواند theme فعال جدول را تغییر دهد.

شناسه‌های داخلی themeها تغییر نکرده‌اند تا کلاس‌های CSS موجود (`theme-1` تا `theme-15`) و رنگ‌بندی فعلی حفظ شوند.

تعریف رنگ‌ها در `assets/css/main.css` انجام شده است.

'''
          text = re.sub(r'## 8\. سیستم ۱۵ حالت رنگی PDF\n.*?(?=## 9\. CSS و responsive design)', new_section, text, flags=re.S)
          text = text.replace('- انتخاب حالت رنگی را در localStorage نگه می‌دارد.', '- در هر بار بارگذاری، حالت «بدون دسته‌بندی» را به‌صورت پیش‌فرض فعال می‌کند.')
          text = text.rstrip() + '''\n\n## 25. آخرین تغییرات selector دسته‌بندی PDF

- «بدون دسته‌بندی» در ابتدای selector قرار گرفته و حالت پیش‌فرض سایت است.
- سایر دسته‌بندی‌ها بر اساس گروه‌های Physical، Atomic، Chemical، Classification و History مرتب شده‌اند.
- نوع هر دسته‌بندی داخل پرانتز کنار عنوان آن نمایش داده می‌شود.
- با refresh صفحه، جدول دوباره با حالت «بدون دسته‌بندی» نمایش داده می‌شود.
- معماری داده، CSVها و کلاس‌های رنگ‌بندی موجود حفظ شده‌اند.\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-pdf-theme-docs.yml
          git add README.md .github/workflows/update-pdf-theme-docs.yml
          git diff --cached --quiet || git commit -m "Document grouped PDF theme selector behavior"
          git push
