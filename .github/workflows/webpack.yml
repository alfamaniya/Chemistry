name: Static site validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Validate project files
      run: |
        test -f index.html
        test -f assets/css/main.css
        test -f assets/js/main.js
        test -f assets/js/app.js
        test -f assets/js/core/i18n.js
        test -f assets/js/core/data.js
        test -f assets/js/components/header/header.js
        test -f assets/js/components/hero/hero.js
        test -f assets/js/components/periodic-table/periodic-table.js
        test -f assets/js/components/element-details/element-details.js
        test -f assets/js/components/footer/footer.js
        for file in \
          assets/css/components/header.css \
          assets/css/components/hero.css \
          assets/css/components/periodic-table.css \
          assets/css/components/element-details.css \
          assets/css/components/footer.css; do
          test -s "$file"
        done
        test -f data/PubChemElements_all.csv
        test -f data/ELEMENTS_118_ADVANCED.csv
        test -f data/ELEMENTS_118_VERY_ADVANCED.csv

    - name: Check JavaScript syntax
      run: |
        find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

    - name: Validate runtime architecture contracts
      run: |
        grep -q 'chemistry-element-selection' assets/js/main.js
        grep -q 'rgba(37,99,235' assets/js/main.js
        grep -q 'rgba(22,163,74' assets/js/main.js
        grep -q 'rgba(220,38,38' assets/js/main.js
        ! grep -R -q 'element-selection-flash' assets/css
        grep -q 'periodicTitle' assets/js/components/periodic-table/periodic-table.js
        grep -q 'selectedElementTitle' assets/js/components/element-details/element-details.js

    - name: Validate runtime CSV headers and row widths
      run: |
        python3 - <<'PY'
        import csv
        from pathlib import Path

        files = [
            Path("data/PubChemElements_all.csv"),
            Path("data/ELEMENTS_118_ADVANCED.csv"),
            Path("data/ELEMENTS_118_VERY_ADVANCED.csv"),
        ]
        for path in files:
            with path.open("r", encoding="utf-8-sig", newline="") as handle:
                rows = list(csv.reader(handle))
            assert rows and all(rows[0]), f"Invalid header: {path}"
            width = len(rows[0])
            malformed = [i + 2 for i, row in enumerate(rows[1:]) if len(row) != width]
            assert not malformed, f"Malformed rows in {path}: {malformed[:5]}"
            assert len(rows) - 1 == 118, f"Expected 118 data rows in {path}, got {len(rows) - 1}"
            print(f"validated {path}: {len(rows) - 1} data rows")
        PY

    - name: Validate retained data inventory
      run: |
        count=$(find data/Elements -maxdepth 1 -type f -name '*.csv' | wc -l)
        test "$count" -eq 118
        echo "validated data/Elements inventory: $count CSV files retained as non-runtime data"

    - name: Smoke test local site
      run: |
        python3 -m http.server 8000 >/tmp/chemistry-http.log 2>&1 &
        SERVER_PID=$!
        trap 'kill $SERVER_PID' EXIT
        sleep 2
        curl --fail --silent --show-error http://127.0.0.1:8000/index.html >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/assets/js/main.js >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/assets/js/app.js >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/assets/js/core/i18n.js >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/assets/js/core/data.js >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/assets/js/components/periodic-table/periodic-table.js >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/assets/js/components/element-details/element-details.js >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/data/PubChemElements_all.csv >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/data/ELEMENTS_118_ADVANCED.csv >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8000/data/ELEMENTS_118_VERY_ADVANCED.csv >/dev/null
