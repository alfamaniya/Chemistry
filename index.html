<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="جدول تناوبی تعاملی عناصر شیمیایی">
  <title>جدول تناوبی عناصر</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">CHEMISTRY</p>
      <h1>جدول تناوبی عناصر</h1>
      <p class="subtitle">جدول مندلیف — نمایش پویا و واکنش‌گرا</p>
    </header>

    <div class="table-scroll">
      <section id="periodic-table" class="periodic-table" aria-label="جدول تناوبی عناصر"></section>
    </div>

    <section class="category-panel" aria-labelledby="category-title">
      <div class="category-heading">
        <div>
          <p class="category-eyebrow">ELEMENT CATEGORIES</p>
          <h2 id="category-title">دسته‌بندی عناصر</h2>
        </div>
        <button id="clear-category" class="category-clear" type="button">نمایش همه</button>
      </div>
      <div id="category-grid" class="category-grid" aria-label="دسته‌بندی‌های عناصر"></div>
    </section>
  </main>

  <div id="element-modal" class="modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section
      class="modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      aria-describedby="modal-summary"
    >
      <button class="modal-close" type="button" aria-label="بستن" data-close-modal>×</button>
      <div class="modal-number" id="modal-number"></div>
      <div class="modal-symbol" id="modal-symbol"></div>
      <h2 id="modal-title"></h2>
      <p class="modal-english" id="modal-english"></p>
      <p class="modal-summary" id="modal-summary"></p>
    </section>
  </div>

  <script>
    const table = document.getElementById("periodic-table");
    const modal = document.getElementById("element-modal");
    const modalNumber = document.getElementById("modal-number");
    const modalSymbol = document.getElementById("modal-symbol");
    const modalTitle = document.getElementById("modal-title");
    const modalEnglish = document.getElementById("modal-english");
    const modalSummary = document.getElementById("modal-summary");
    const categoryGrid = document.getElementById("category-grid");
    const clearCategory = document.getElementById("clear-category");
    let elementCards = new Map();
    let categoryElements = new Map();
    let activeCategory = null;
    let lastFocusedElement = null;

    const categoryColors = {
      metals: "#2563eb",
      "non-metals": "#16a34a",
      "semi-metals": "#d97706",
      unclassified: "#64748b",
      hydrogen: "#dc2626",
      "alkali-metals": "#b91c1c",
      "alkaline-earth-metals": "#ea580c",
      "group-3": "#7c3aed",
      "group-4": "#6d28d9",
      "group-5": "#5b21b6",
      "group-6": "#4338ca",
      "group-7": "#3730a3",
      "group-8": "#1d4ed8",
      "group-9": "#0369a1",
      "group-10": "#0f766e",
      "group-11": "#15803d",
      "group-12": "#4d7c0f",
      "group-13": "#ca8a04",
      "group-14": "#c2410c",
      pnictogens: "#be123c",
      chalcogens: "#c026d3",
      halogens: "#7e22ce",
      "noble-gases": "#0891b2",
      lanthanides: "#9333ea",
      actinides: "#a21caf"
    };

    fetch("database/elements.json")
      .then(response => {
        if (!response.ok) throw new Error("خطا در دریافت پایگاه داده عناصر");
        return response.json();
      })
      .then(async elements => {
        elements.forEach(element => {
          let row, column;

          if (element.atomicNumber === 1) {
            [row, column] = [1, 1];
          } else if (element.atomicNumber === 2) {
            [row, column] = [1, 18];
          } else if (element.atomicNumber >= 3 && element.atomicNumber <= 10) {
            const positions = {
              3:[2,1], 4:[2,2], 5:[2,13], 6:[2,14],
              7:[2,15], 8:[2,16], 9:[2,17], 10:[2,18]
            };
            [row, column] = positions[element.atomicNumber];
          } else if (element.atomicNumber >= 11 && element.atomicNumber <= 18) {
            const positions = {
              11:[3,1], 12:[3,2], 13:[3,13], 14:[3,14],
              15:[3,15], 16:[3,16], 17:[3,17], 18:[3,18]
            };
            [row, column] = positions[element.atomicNumber];
          } else if (element.atomicNumber === 57) {
            [row, column] = [6, 3];
          } else if (element.atomicNumber === 89) {
            [row, column] = [7, 3];
          } else if (
            (element.atomicNumber >= 58 && element.atomicNumber <= 71) ||
            (element.atomicNumber >= 90 && element.atomicNumber <= 103)
          ) {
            return;
          } else {
            const period =
              element.atomicNumber <= 36 ? 4 :
              element.atomicNumber <= 54 ? 5 :
              element.atomicNumber <= 86 ? 6 : 7;

            const start =
              period === 4 ? 19 :
              period === 5 ? 37 :
              period === 6 ? 72 : 104;

            [row, column] = [period, element.atomicNumber - start + 3];
          }

          appendElement(element, row, column);
        });

        const lanthanides = elements.filter(e => e.atomicNumber >= 58 && e.atomicNumber <= 71);
        const actinides = elements.filter(e => e.atomicNumber >= 90 && e.atomicNumber <= 103);

        [[lanthanides, 8], [actinides, 9]].forEach(([series, row]) => {
          series.forEach((element, index) => {
            appendElement(element, row, index + 4, true);
          });
        });

        const categoryResponse = await fetch("database/categories/categories.json");
        if (!categoryResponse.ok) throw new Error("خطا در دریافت دسته‌بندی عناصر");
        const categoryData = await categoryResponse.json();
        renderCategories(categoryData.categories);
      })
      .catch(error => {
        table.innerHTML = '<p class="error">بارگذاری عناصر با خطا مواجه شد.</p>';
        console.error(error);
      });

    function appendElement(element, row, column, isSeries = false) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = isSeries ? "element series-element" : "element";
      card.style.gridRow = row;
      card.style.gridColumn = column;
      card.dataset.number = element.atomicNumber;
      card.dataset.symbol = element.symbol;
      elementCards.set(String(element.atomicNumber), card);
      card.title = `${element.persianName || element.englishName} — ${element.englishName}`;
      card.setAttribute(
        "aria-label",
        `عنصر ${element.persianName || element.englishName}، نام انگلیسی ${element.englishName}، نماد ${element.symbol}، عدد اتمی ${element.atomicNumber}`
      );

      card.innerHTML = `
        <span class="atomic-number" aria-label="عدد اتمی">${element.atomicNumber}</span>
        <strong class="symbol" aria-label="نماد">${element.symbol}</strong>
        <span class="name" dir="rtl">${element.persianName || element.englishName}</span>
        <span class="english-name" dir="ltr">${element.englishName}</span>
      `;

      card.addEventListener("click", () => openModal(element, card));
      table.appendChild(card);
    }

    function openModal(element, trigger) {
      lastFocusedElement = trigger;
      const displayName = element.persianName || element.englishName;

      modalNumber.textContent = `عدد اتمی: ${element.atomicNumber}`;
      modalSymbol.textContent = element.symbol;
      modalTitle.textContent = displayName;
      modalEnglish.textContent = element.persianName
        ? `نام انگلیسی: ${element.englishName}`
        : `نام: ${element.englishName}`;
      modalSummary.textContent =
        `این پنجره خلاصه‌ای از اطلاعات موجود برای عنصر ${element.englishName} را نمایش می‌دهد: نماد ${element.symbol} و عدد اتمی ${element.atomicNumber}.`;

      modal.hidden = false;
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      modal.querySelector(".modal-close").focus();
    }

    function closeModal() {
      if (modal.hidden) return;
      modal.hidden = true;
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      lastFocusedElement?.focus();
    }

    function renderCategories(categories) {
      categoryGrid.innerHTML = "";

      Object.entries(categories).forEach(([key, category]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category-tile";
        button.dataset.category = key;
        button.style.setProperty("--category-color", categoryColors[key] || "#475569");
        button.setAttribute(
          "aria-label",
          `دسته‌بندی ${category.persianName}، شامل ${category.elements.length} عنصر`
        );

        const numbers = category.elements.map(element => String(element.atomicNumber));
        categoryElements.set(key, numbers);

        button.innerHTML = `
          <span class="category-color-dot" aria-hidden="true"></span>
          <strong class="category-name" dir="rtl">${category.persianName}</strong>
          <span class="category-english" dir="ltr">${formatCategoryName(key)}</span>
          <span class="category-count" dir="rtl">${category.elements.length} عنصر</span>
        `;

        button.addEventListener("click", () => selectCategory(key));
        categoryGrid.appendChild(button);
      });
    }

    function formatCategoryName(key) {
      return key
        .split("-")
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
    }

    function selectCategory(key) {
      if (activeCategory === key) {
        clearCategorySelection();
        return;
      }

      activeCategory = key;
      const activeNumbers = new Set(categoryElements.get(key) || []);

      elementCards.forEach((card, atomicNumber) => {
        const isActive = activeNumbers.has(atomicNumber);
        card.classList.toggle("category-active", isActive);
        card.classList.toggle("category-dimmed", !isActive);

        if (isActive) {
          card.style.setProperty("--active-category-color", categoryColors[key] || "#2563eb");
        } else {
          card.style.removeProperty("--active-category-color");
        }
      });

      document.querySelectorAll(".category-tile").forEach(tile => {
        const isActive = tile.dataset.category === key;
        tile.classList.toggle("is-active", isActive);
        tile.classList.toggle("is-inactive", !isActive);
      });
    }

    function clearCategorySelection() {
      activeCategory = null;

      elementCards.forEach(card => {
        card.classList.remove("category-active", "category-dimmed");
        card.style.removeProperty("--active-category-color");
      });

      document.querySelectorAll(".category-tile").forEach(tile => {
        tile.classList.remove("is-active", "is-inactive");
      });
    }

    clearCategory.addEventListener("click", clearCategorySelection);

    modal.addEventListener("click", event => {
      if (event.target.matches("[data-close-modal]")) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !modal.hidden) closeModal();
    });
  </script>
</body>
</html>
