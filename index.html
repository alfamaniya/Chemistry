<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/background-gradient.css" />
    <link rel="stylesheet" href="styles/bidi.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/description-box.css" />
    <link rel="stylesheet" href="styles/search-box.css" />
    <link rel="stylesheet" href="styles/periodic-table-box.css" />
    <link rel="stylesheet" href="styles/information-boxes.css" />
    <link rel="stylesheet" href="styles/site-preferences.css" />
    <title>Chemistry</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__content">
        <button class="site-header__action" type="button" data-action="language">English</button>
        <button class="site-header__action" type="button" data-action="theme">حالت تاریک</button>
      </div>
    </header>

    <main>
      <section class="description-box" aria-label="توضیحات">
        <div class="description-box__content">
          <p class="description-box__text bidi-text" data-i18n="description">توضیحات صفحه در این قسمت قرار می‌گیرد.</p>
        </div>
      </section>

      <section class="search-box" aria-label="جستجو">
        <div class="search-box__content">
          <label class="search-box__label" for="search-input" data-i18n="search-label">جستجو</label>
          <input class="search-box__input bidi-text" id="search-input" type="search" data-i18n="search-placeholder" placeholder="عبارت مورد نظر را وارد کنید" />
          <button class="search-box__button" type="button" data-i18n="search-button">جستجو</button>
        </div>
      </section>

      <section class="periodic-table-box" aria-label="جدول تناوبی">
        <div class="periodic-table-box__content">
          <div class="periodic-table-box__header">
            <h2 class="periodic-table-box__title" data-i18n="periodic-table-title">جدول تناوبی</h2>
          </div>
          <div class="periodic-table" id="periodic-table" aria-label="Periodic Table">
            <!-- عناصر جدول تناوبی در این بخش قرار خواهند گرفت. -->
          </div>
        </div>
      </section>

      <section class="information-box information-box--basic" aria-label="اطلاعات پایه">
        <div class="information-box__content">
          <h2 class="information-box__title" data-i18n="basic-information-title">اطلاعات پایه</h2>
          <div class="information-box__body" data-i18n="basic-information-placeholder">اطلاعات پایه در این قسمت نمایش داده خواهد شد.</div>
        </div>
      </section>

      <section class="information-box information-box--advanced" aria-label="اطلاعات پیشرفته">
        <div class="information-box__content">
          <h2 class="information-box__title" data-i18n="advanced-information-title">اطلاعات پیشرفته</h2>
          <div class="information-box__body" data-i18n="advanced-information-placeholder">اطلاعات پیشرفته در این قسمت نمایش داده خواهد شد.</div>
        </div>
      </section>

      <section class="information-box information-box--professional" aria-label="اطلاعات حرفه‌ای">
        <div class="information-box__content">
          <h2 class="information-box__title" data-i18n="professional-information-title">اطلاعات حرفه‌ای</h2>
          <div class="information-box__body" data-i18n="professional-information-placeholder">اطلاعات حرفه‌ای در این قسمت نمایش داده خواهد شد.</div>
        </div>
      </section>
    </main>

    <script src="scripts/site-preferences.js"></script>
  </body>
</html>
