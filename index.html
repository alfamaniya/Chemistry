<title>ELEMENTS — Interactive Periodic Table</title>
<style>
:root{
 --bg:#05070d;--panel:rgba(10,14,24,.78);--panel2:rgba(255,255,255,.045);
 --ink:#f4f7ff;--muted:#aab3c6;--line:rgba(255,255,255,.13);--accent:#e8d1cb;
 --alkali:#a9565f;--alkaline:#756fae;--transition:#4f79a8;--post:#4f9360;
 --metalloid:#89974d;--nonmetal:#8d822c;--halogen:#a7832c;--noble:#9a6a3a;
 --lanthanide:#3b8585;--actinide:#398261;--unknown:#596174;
 --mx:0%;--cb:rgba(255,255,255,.35);--ct:#fff;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:
 radial-gradient(circle at 50% 15%,rgba(113,125,155,.16),transparent 34%),
 linear-gradient(135deg,#05070d,#0a0d15 55%,#05070d);
 color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stage{min-height:100vh;padding:30px;position:relative;overflow:hidden}
.stage:before{content:"";position:fixed;inset:30px;border:1px solid var(--line);pointer-events:none;
 clip-path:polygon(0 0,26px 0,26px 1px,calc(100% - 26px) 1px,calc(100% - 26px) 0,100% 0,100% 26px,calc(100% - 1px) 26px,calc(100% - 1px) calc(100% - 26px),100% calc(100% - 26px),100% 100%,calc(100% - 26px) 100%,calc(100% - 26px) calc(100% - 1px),26px calc(100% - 1px),26px 100%,0 100%,0 calc(100% - 26px),1px calc(100% - 26px),1px 26px,0 26px)}
.shell{max-width:1700px;margin:0 auto;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:18px;min-height:58px;padding:0 10px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:max-content}
.brandmark{width:38px;height:38px;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;
 background:linear-gradient(135deg,rgba(232,209,203,.2),rgba(255,255,255,.02));font-weight:800;letter-spacing:-1px}
.brand h1{font-size:16px;letter-spacing:.16em;margin:0;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.topnav{display:flex;gap:18px;margin-inline-start:auto;align-items:center}
.topnav button,.topnav .navbtn{border:0;background:none;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 4px}
.topnav button:hover,.topnav .navbtn:hover{color:#fff}
.action{height:38px;padding:0 15px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);letter-spacing:.1em;font-size:10px;text-transform:uppercase}
.action.primary{background:var(--accent);color:#15131b;border-color:var(--accent)}
.toolbar{display:grid;grid-template-columns:minmax(250px,1.6fr) minmax(220px,1fr) auto;gap:12px;align-items:center;padding:20px 0 12px}
.search{position:relative}
.search input{width:100%;height:48px;border:1px solid var(--line);background:rgba(255,255,255,.035);padding:0 16px;outline:0;color:#fff}
.search input:focus{border-color:rgba(232,209,203,.65)}
#res{position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:80;background:#0b101a;border:1px solid var(--line);max-height:300px;overflow:auto;box-shadow:0 20px 50px #0008}
#res button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;text-align:start}
#res button:hover{background:rgba(255,255,255,.06)}
#res b{width:38px;height:38px;display:grid;place-items:center;background:var(--c);color:#fff}
#res small{margin-inline-start:auto;color:var(--muted)}
.controlbar{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.controlbar .select{height:48px;border:1px solid var(--line);background:rgba(255,255,255,.035);padding:0 12px;min-width:210px}
.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.meta output{color:#fff}
.panel{background:rgba(255,255,255,.025);border:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1fr);gap:16px;margin-bottom:10px}
.panel label{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;letter-spacing:.1em;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--accent)}
.states{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin-top:5px}
.states i{display:inline-block;width:18px;height:3px;margin-inline-end:5px}
.legend{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:5px 9px;color:var(--muted);font-size:10px}
.chip[aria-pressed=true]{color:#fff;border-color:var(--accent)}
.chip i{width:12px;height:12px;background:var(--c);display:inline-block}
.tw{overflow:auto;padding:12px 0 32px}
#table{direction:ltr;display:grid;min-width:1040px;gap:4px;grid-template-columns:24px repeat(18,minmax(45px,1fr));grid-template-rows:20px repeat(7,minmax(74px,1fr)) 14px 74px 74px}
.gl,.pl{display:grid;place-items:center;color:#626d82;font-size:9px;letter-spacing:.08em}
.cell{container-type:inline-size;position:relative;min-width:0;aspect-ratio:1/.94;padding:5px 2px;border:1px solid rgba(255,255,255,.18);border-radius:0;background:linear-gradient(145deg,color-mix(in srgb,var(--c),#fff 4%),var(--c));color:var(--ct);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .2s,box-shadow .2s,filter .2s,opacity .2s}
.cell:hover,.cell:focus-visible{transform:translateY(-4px) scale(1.08);z-index:20;box-shadow:0 16px 35px #0009;border-color:rgba(255,255,255,.6)}
.cell::after{content:"";position:absolute;left:15%;right:15%;bottom:4px;height:2px;background:var(--st,transparent)}
.n{font-size:max(8px,15cqw);opacity:.72}.s{font-size:max(15px,38cqw);font-weight:800;letter-spacing:-.04em}.nm{display:none;font-size:max(8px,12cqw);max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
@container (min-width:64px){.nm{display:block}}
.cell.heat{background:var(--heat);color:var(--hf)}.cell.heat .nm{display:block}.cell.dim{opacity:.12;filter:grayscale(1)}
.ph{aspect-ratio:auto;font-size:9px}.ph .s{font-size:inherit;font-weight:700}
footer{border-top:1px solid var(--line);padding:12px 0;color:#657087;font-size:10px;letter-spacing:.05em}
aside{position:fixed;inset-block:0;inset-inline-end:0;width:min(520px,100%);background:#0a0f19;z-index:120;overflow-y:auto;box-shadow:-30px 0 70px #0009;transform:translateX(105%);transition:transform .35s ease;visibility:hidden;border-inline-start:1px solid var(--line)}
[dir=rtl] aside{transform:translateX(-105%)}aside.open{transform:none;visibility:visible}
#ov{position:fixed;inset:0;background:#0009;z-index:115;backdrop-filter:blur(4px)}#ov[hidden]{display:none}
.dh{display:flex;gap:14px;align-items:center;padding:22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,transparent),transparent)}
.big{width:88px;height:98px;background:var(--c);border:1px solid rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr;flex:none}.big span{font-size:11px}.big b{font-size:42px}.dh h2{margin:0;font-size:26px}.dh p{margin:2px 0;color:var(--muted);font-size:12px}.acts{margin-inline-start:auto;display:flex;flex-direction:column;gap:7px}.ic{width:38px;height:38px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:18px 22px}.grid>div{padding:11px 0;border-bottom:1px solid var(--line)}.grid .w{grid-column:1/-1}.grid dt{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.grid dd{margin:2px 0 0;font-weight:700}.grid .mono{font-family:ui-monospace,monospace;direction:ltr;text-align:start}
.about{margin:0 22px 25px;padding:12px 14px;border:1px solid var(--line);color:var(--muted);font-size:12px}
dialog{border:1px solid var(--line);border-radius:0;padding:0;background:#0a0f19;color:#fff;width:min(720px,94vw);max-height:90vh}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}.dp{padding:22px}.dt{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dt h3{margin:0;font-size:20px}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.cmp select{height:42px;background:#101725;border:1px solid var(--line);padding:0 10px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start}th{color:var(--muted);font-size:11px}td{direction:ltr;text-align:center}.hi{color:var(--accent);font-weight:800}.go{width:100%;height:44px;border:0;background:var(--accent);color:#15131b;font-weight:800}.ctr{text-align:center}.qq{font-size:20px;font-weight:800}.qo{display:grid;gap:8px}.qo button{padding:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}.qo .ok{background:#247a4a;color:#fff}.qo .bad{background:#8b3038;color:#fff}
@media(max-width:1100px){.toolbar{grid-template-columns:1fr}.controlbar{justify-content:flex-start}.panel{grid-template-columns:1fr}.legend{grid-column:auto}.topnav{display:none}}
@media(max-width:650px){.stage{padding:18px}.stage:before{inset:18px}.top{padding-inline:0}.brand p{display:none}.action{padding:0 10px}.toolbar{padding-top:14px}.panel{padding:12px}.grid{grid-template-columns:1fr}.grid .w{grid-column:auto}.cmp{grid-template-columns:1fr}.tw{margin-inline:-4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const t=k=>T[S.lang][k]??k;
const nm=e=>S.lang==="fa"?e.fa:e.nm;
const norm=s=>String(s).toLowerCase().replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
const val=(x,u)=>x==null||x===""?"—":x+(u?" "+u:"");
const fmt=v=>v<0.001?v.toExponential(1):Math.abs(v)>=100?String(Math.round(v)):String(+v.toPrecision(3));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function phase(e){const x=S.temp,{mp,bp}=e;
 if(mp==null&&bp==null)return"unknown";
 if(mp!=null&&x<mp)return"solid";
 if(bp!=null)return x<bp?(mp!=null?"liquid":"unknown"):"gas";
 return"unknown"}
const PCOL={solid:"#1d4ed8",liquid:"#059669",gas:"#d97706",unknown:"#94a3b8"};

function buildTable(){
 const g=$("#table");g.innerHTML="";
 for(let i=1;i<=18;i++){const d=document.createElement("div");d.className="gl";d.textContent=i;d.style.gridArea=`1/${i+1}`;g.append(d)}
 for(let p=1;p<=7;p++){const d=document.createElement("div");d.className="pl";d.textContent=p;d.style.gridArea=`${p+1}/1`;g.append(d)}
 [[3,7,"lanthanide","57–71"],[3,8,"actinide","89–103"]].forEach(([c,r,k,l])=>{
  const b=document.createElement("button");b.className="cell ph";b.style.gridArea=`${r}/${c+1}`;b.style.setProperty("--c",`var(--${k})`);
  b.innerHTML=`<span class="s">${l}</span>`;b.dataset.cat=k;b.title=T[S.lang].cats[k];g.append(b)});
 DATA.forEach(e=>{
  const b=document.createElement("button");b.className="cell";b.dataset.n=e.n;
  b.style.gridArea=`${e.row+1}/${e.col+1}`;b.style.setProperty("--c",`var(--${e.cat})`);
  b.innerHTML=`<span class="n">${e.n}</span><span class="s">${e.s}</span><span class="nm"></span>`;
  g.append(b)});
}
function match(e){const q=norm(S.q);return !q||norm(e.s)===q||norm(e.nm).includes(q)||norm(e.fa).includes(q)||String(e.n)===q||norm(e.s).startsWith(q)}
function view(){
 const k=S.trend;let rng=null;
 if(k!=="none"){const vs=DATA.map(e=>e[k]).filter(v=>v!=null),log=k==="d",f=v=>log?Math.log(v):v;
  const lo=Math.min(...vs.map(f)),hi=Math.max(...vs.map(f));rng={lo,hi,f};
  const u=TR.find(r=>r[0]===k)[2];$("#hmin").textContent=fmt(Math.min(...vs))+" "+u;$("#hmax").textContent=fmt(Math.max(...vs))+" "+u}
 $("#hbar").hidden=!rng;
 document.querySelectorAll(".cell[data-n]").forEach(c=>{
  const e=DATA[c.dataset.n-1];let dim=!match(e)||(S.cat&&e.cat!==S.cat);
  c.querySelector(".nm").textContent=nm(e);
  const ph=phase(e);c.style.setProperty("--st",PCOL[ph]);
  c.title=`${nm(e)} · ${t("cats")[e.cat]} · ${t(ph)}`;c.setAttribute("aria-label",c.title);
  c.classList.remove("heat");
  if(rng){const v=e[k];
   if(v==null){dim=true}else{const x=(rng.f(v)-rng.lo)/(rng.hi-rng.lo||1),l=92-x*55;
    c.classList.add("heat");c.style.setProperty("--heat",`hsl(215 70% ${l}%)`);c.style.setProperty("--hf",l>58?"#111827":"#fff");
    c.querySelector(".nm").textContent=fmt(v)}}
  c.classList.toggle("dim",!!dim)});
 document.querySelectorAll(".ph").forEach(c=>c.classList.toggle("dim",!!S.cat&&c.dataset.cat!==S.cat));
 document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.cat===S.cat));
}
function statics(){
 const h=document.documentElement;h.lang=S.lang;h.dir=S.lang==="fa"?"rtl":"ltr";h.dataset.theme=S.theme;
 document.querySelectorAll("[data-i]").forEach(n=>n.textContent=t(n.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(n=>n.placeholder=t(n.dataset.ph));
 $("#lEn").setAttribute("aria-pressed",S.lang==="en");$("#lFa").setAttribute("aria-pressed",S.lang==="fa");
 $("#bTheme").textContent=S.theme==="dark"?"☀":"☾";
 $("#trend").innerHTML=`<option value="none">${t("t_none")}</option>`+TR.map(r=>`<option value="${r[0]}">${t(r[1])}</option>`).join("");$("#trend").value=S.trend;
 $("#legend").innerHTML=CATS.map(k=>`<button class="chip" data-cat="${k}" style="--c:var(--${k})"><i></i>${T[S.lang].cats[k]}</button>`).join("");
 $("#tv").textContent=`${S.temp} K (${Math.round(S.temp-273.15)} °C)`;
}
function dRow(l,v,c){return`<div class="${c||""}"><dt>${l}</dt><dd class="${c==="w mono"?"mono":""}">${v}</dd></div>`}
function openEl(n){
 const e=DATA[n-1],d=$("#drawer");S.cur=n;
 d.innerHTML=`<div class="dh" style="--c:var(--${e.cat})"><div class="big" style="--c:var(--${e.cat})"><span>${e.n}</span><b>${e.s}</b></div>
 <div><h2 id="dname">${nm(e)}</h2><p>${S.lang==="fa"?e.nm:e.fa}</p><p>${t("cats")[e.cat]}</p></div>
 <div class="acts"><button class="ic" id="dx" aria-label="close">✕</button><button class="ic" id="dc" title="${t("addCmp")}" aria-label="${t("addCmp")}">⇄</button></div></div>
 <dl class="grid">${dRow(t("mass"),val(e.m,"u"))}${dRow(t("state"),e.st?(t("st")[e.st]||e.st):"—")}
 ${dRow(t("cfg"),val(e.cfg),"w mono")}${dRow(t("grp"),e.group??"—")}${dRow(t("per"),e.period)}
 ${dRow(t("mp"),val(e.mp,"K"))}${dRow(t("bp"),val(e.bp,"K"))}${dRow(t("dens"),val(e.d,"g/cm³"))}${dRow(t("enl"),val(e.en))}
 ${dRow(t("rad"),val(e.r,"pm"))}${dRow(t("iel"),val(e.ie,"eV"))}${dRow(t("eal"),val(e.ea,"eV"))}
 ${dRow(t("ox"),val(e.ox))}${dRow(t("year"),e.y==="Ancient"?t("ancient"):val(e.y))}</dl>
 <p class="about"><b>${t("about")}</b><br>${t("desc")[e.cat]||""}</p>`;
 d.classList.add("open");$("#ov").hidden=false;$("#dx").focus();
 $("#dx").onclick=closeEl;$("#dc").onclick=()=>{closeEl();addCmp(n)};
}
function closeEl(){$("#drawer").classList.remove("open");$("#ov").hidden=true;S.cur=null}
function addCmp(n){if(S.cmp[0]==null)S.cmp[0]=n;else if(S.cmp[1]==null&&S.cmp[0]!==n)S.cmp[1]=n;else if(S.cmp[0]!==n&&S.cmp[1]!==n)S.cmp=[S.cmp[1],n];openCmp()}
function openCmp(){renderCmp();$("#cmpD").showModal()}
function renderCmp(){
 const o=`<option value="">${t("pick")}</option>`+DATA.map(e=>`<option value="${e.n}">${e.n} · ${e.s} · ${nm(e)}</option>`).join("");
 ["a","b"].forEach((k,i)=>{const s=$("#cs"+k);s.innerHTML=o;s.value=S.cmp[i]||""});
 const [A,B]=S.cmp.map(n=>n?DATA[n-1]:null);
 const R=[["mass","m","u"],["enl","en",""],["rad","r","pm"],["iel","ie","eV"],["eal","ea","eV"],["mp","mp","K"],["bp","bp","K"],["dens","d","g/cm³"]];
 let h=`<tr><th></th><td>${A?`<b style="font-size:26px">${A.s}</b>`:"—"}</td><td>${B?`<b style="font-size:26px">${B.s}</b>`:"—"}</td></tr>`;
 R.forEach(([l,k,u])=>{const a=A?.[k],b=B?.[k],hi=a!=null&&b!=null&&a!==b?(a>b?0:1):-1;
  h+=`<tr><th>${t(l)}</th><td class="${hi===0?"hi":""}">${val(a,u)}</td><td class="${hi===1?"hi":""}">${val(b,u)}</td></tr>`});
 [["state",x=>x.st?(t("st")[x.st]||x.st):"—"],["ox",x=>val(x.ox)],["cfg",x=>val(x.cfg)]].forEach(([l,f])=>h+=`<tr><th>${t(l)}</th><td>${A?f(A):"—"}</td><td>${B?f(B):"—"}</td></tr>`);
 $("#ctab").innerHTML=h;
}
function qStart(){
 const items=shuffle(DATA).slice(0,10).map(e=>({e,type:Math.random()*3|0,opts:shuffle([e,...shuffle(DATA.filter(x=>x!==e)).slice(0,3)])}));
 S.qz={i:0,sc:0,items,lock:false};$("#qs").hidden=true;$("#qr").hidden=true;$("#qa").hidden=false;qShow();
}
function qShow(){
 const z=S.qz,it=z.items[z.i],e=it.e;
 $("#qp").textContent=`${t("question")} ${z.i+1}/10`;$("#qsc").textContent=`${t("score")}: ${z.sc}`;
 $("#qq").innerHTML=`${t("q"+(it.type+1))}<br><span style="font-size:30px;color:var(--ac)">${it.type===1?e.s:nm(e)}</span>`;
 const lab=x=>it.type===0?x.s:it.type===1?nm(x):x.n;
 $("#qo").innerHTML=it.opts.map((x,i)=>`<button data-i="${i}">${lab(x)}</button>`).join("");
 z.lock=false;
}
function qAnswer(b){
 const z=S.qz;if(z.lock)return;z.lock=true;const it=z.items[z.i],ok=it.opts[b.dataset.i]===it.e;
 if(ok)z.sc+=10;
 document.querySelectorAll("#qo button").forEach((x,i)=>{x.disabled=true;if(it.opts[i]===it.e)x.classList.add("ok")});
 if(!ok)b.classList.add("bad");
 $("#qsc").textContent=`${t("score")}: ${z.sc}`;
 setTimeout(()=>{z.i++;if(z.i<10)qShow();else{$("#qa").hidden=true;$("#qr").hidden=false;$("#qrt").textContent=t("qzDone");$("#qrs").textContent=`${z.sc} / 100`}},900);
}
function search(){
 const box=$("#res");S.q=$("#q").value;view();
 if(!norm(S.q)){box.hidden=true;return}
 const m=DATA.filter(match).slice(0,8);
 box.innerHTML=m.map(e=>`<button data-n="${e.n}"><b style="--c:var(--${e.cat})">${e.s}</b><span>${nm(e)}</span><small>#${e.n}</small></button>`).join("");
 box.hidden=!m.length;
}
// events
$("#table").onclick=e=>{const c=e.target.closest(".cell");if(!c)return;if(c.dataset.n)openEl(+c.dataset.n);else{S.cat=S.cat===c.dataset.cat?null:c.dataset.cat;view()}};
$("#legend").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;S.cat=S.cat===c.dataset.cat?null:c.dataset.cat;view()};
$("#tmp").oninput=e=>{S.temp=+e.target.value;$("#tv").textContent=`${S.temp} K (${Math.round(S.temp-273.15)} °C)`;view()};
$("#trend").onchange=e=>{S.trend=e.target.value;view()};
$("#q").oninput=search;
$("#q").onkeydown=e=>{if(e.key==="Enter"){const b=$("#res button");if(b)b.click()}else if(e.key==="Escape"){$("#res").hidden=true}else if(e.key==="ArrowDown"){const b=$("#res button");if(b){e.preventDefault();b.focus()}}};
$("#res").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("#res").hidden=true;$("#q").value="";S.q="";view();openEl(+b.dataset.n)};
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("#res").hidden=true});
$("#ov").onclick=closeEl;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.cur)closeEl()});
$("#bTheme").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";store.set("theme",S.theme);statics();view()};
const setLang=l=>{S.lang=l;store.set("lang",l);statics();view();if($("#cmpD").open)renderCmp();if(S.cur)openEl(S.cur)};
$("#lEn").onclick=()=>setLang("en");$("#lFa").onclick=()=>setLang("fa");
$("#bCmp").onclick=openCmp;
$("#bQuiz").onclick=()=>{$("#qs").hidden=false;$("#qa").hidden=true;$("#qr").hidden=true;$("#qzD").showModal()};
$("#qGo").onclick=qStart;$("#qAgain").onclick=qStart;
$("#qo").onclick=e=>{const b=e.target.closest("button");if(b)qAnswer(b)};
$("#csa").onchange=e=>{S.cmp[0]=+e.target.value||null;renderCmp()};
$("#csb").onchange=e=>{S.cmp[1]=+e.target.value||null;renderCmp()};
document.querySelectorAll("dialog").forEach(d=>{d.addEventListener("click",e=>{if(e.target===d)d.close()});d.querySelector("[data-close]").onclick=()=>d.close()});
buildTable();statics();view();
$("#bCmp2").onclick=openCmp;
$("#tv2").textContent=`${S.temp} K (${Math.round(S.temp-273.15)} °C)`;
</script></body>
</html>
