<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="جدول تناوبی تعاملی عناصر شیمیایی">
  <title>جدول تناوبی عناصر</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">CHEMISTRY</p>
      <h1>جدول تناوبی عناصر</h1>
      <p class="subtitle">یک جدول تناوبی پویا و تعاملی</p>
    </header>

    <section class="periodic-table" aria-label="جدول تناوبی عناصر">
      <button class="element element-hydrogen" type="button">
        <span class="atomic-number">1</span>
        <strong>H</strong>
        <span>هیدروژن</span>
      </button>

      <button class="element element-helium" type="button">
        <span class="atomic-number">2</span>
        <strong>He</strong>
        <span>هلیوم</span>
      </button>
    </section>
  </main>
</body>
</html>
