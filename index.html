<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive periodic table of the elements based on PubChem Elements data.">
  <title>Periodic Table of Elements</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <p class="kicker">CHEMISTRY · PUBCHEM ELEMENTS</p>
        <h1>Periodic Table of Elements</h1>
        <p class="subtitle">Explore atomic mass and the structure of the periodic table.</p>
      </div>
      <div class="source-mark" aria-label="Data source">PubChem</div>
    </header>

    <section class="table-card" aria-label="Interactive periodic table">
      <div class="table-topline">
        <span>118 elements</span>
        <span class="hint">Select an element for details</span>
      </div>
      <div id="periodic-table" class="periodic-table"></div>
    </section>

    <section class="legend" aria-label="Element families">
      <div class="legend-title">Element families</div>
      <div id="legend-items" class="legend-items"></div>
    </section>
  </main>

  <dialog id="element-dialog" class="element-dialog">
    <button id="close-dialog" class="dialog-close" type="button" aria-label="Close">×</button>
    <div class="dialog-number" id="dialog-number"></div>
    <div class="dialog-symbol" id="dialog-symbol"></div>
    <h2 id="dialog-name"></h2>
    <p class="dialog-family" id="dialog-family"></p>
    <div class="property-grid" id="property-grid"></div>
  </dialog>

  <script>
    const table = document.getElementById('periodic-table');
    const legend = document.getElementById('legend-items');
    const dialog = document.getElementById('element-dialog');
    const closeDialog = document.getElementById('close-dialog');

    const familyStyles = {
      'Alkali metal': ['#f6b7c8', '#7d2746'],
      'Alkaline earth metal': ['#f4c1cf', '#7b3048'],
      'Transition metal': ['#b8dce9', '#24566b'],
      'Post-transition metal': ['#bfe4d0', '#24624a'],
      'Metalloid': ['#f4e7a5', '#6b5a12'],
      'Nonmetal': ['#f7edbd', '#6b5a12'],
      'Halogen': ['#f6d69d', '#80551b'],
      'Noble gas': ['#dcebb1', '#4d6320'],
      'Lanthanide': ['#b9e4df', '#256b68'],
      'Actinide': ['#9fd8dd', '#235e65']
    };

    const fallbackFamily = ['#d8e9ee', '#345b67'];

    fetch('data/table.json')
      .then(response => {
        if (!response.ok) throw new Error('Unable to load data/table.json');
        return response.json();
      })
      .then(data => {
        renderTable(data.elements);
        renderLegend(data.elements);
      })
      .catch(error => {
        table.innerHTML = '<p class="load-error">Element data could not be loaded.</p>';
        console.error(error);
      });

    function renderTable(elements) {
      table.innerHTML = '';
      elements.forEach(element => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'element-tile';
        card.style.gridRow = element.r;
        card.style.gridColumn = element.c;

        const family = familyFor(element.n);
        const [background, accent] = familyStyles[family] || fallbackFamily;
        card.style.setProperty('--tile-bg', background);
        card.style.setProperty('--tile-accent', accent);

        card.innerHTML = `
          <span class="atomic-number">${element.n}</span>
          <strong class="symbol">${element.s}</strong>
          <span class="element-name">${element.name}</span>
          <span class="atomic-mass">${formatNumber(element.mass)}</span>
        `;
        card.title = `${element.name} (${element.s})`;
        card.setAttribute('aria-label', `${element.name}, atomic number ${element.n}`);
        card.addEventListener('click', () => showElement(element));
        table.appendChild(card);
      });
    }

    function renderLegend() {
      const families = ['Alkali metal','Alkaline earth metal','Transition metal','Post-transition metal','Metalloid','Nonmetal','Halogen','Noble gas','Lanthanide','Actinide'];
      legend.innerHTML = '';
      families.forEach(family => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        const [background, accent] = familyStyles[family] || fallbackFamily;
        item.style.setProperty('--legend-bg', background);
        item.style.setProperty('--legend-accent', accent);
        item.innerHTML = `<i></i><span>${family}</span>`;
        legend.appendChild(item);
      });
    }

    function showElement(element) {
      const family = familyFor(element.n);
      const [background, accent] = familyStyles[family] || fallbackFamily;
      document.documentElement.style.setProperty('--dialog-accent', accent);
      document.documentElement.style.setProperty('--dialog-bg', background);

      document.getElementById('dialog-number').textContent = `Atomic number ${element.n}`;
      document.getElementById('dialog-symbol').textContent = element.s;
      document.getElementById('dialog-name').textContent = element.name;
      document.getElementById('dialog-family').textContent = family;

      const grid = document.getElementById('property-grid');
      grid.innerHTML = [
        ['Atomic number', element.n],
        ['Symbol', element.s],
        ['Atomic mass', `${formatNumber(element.mass)} u`]
      ].map(([label, value]) => `
        <div class="property"><span>${label}</span><strong>${value}</strong></div>
      `).join('');

      dialog.showModal();
    }

    function familyFor(n) {
      if ([3,11,19,37,55,87].includes(n)) return 'Alkali metal';
      if ([4,12,20,38,56,88].includes(n)) return 'Alkaline earth metal';
      if ((n >= 21 && n <= 30) || (n >= 39 && n <= 48) || (n >= 72 && n <= 80) || (n >= 104 && n <= 112)) return 'Transition metal';
      if ([13,31,49,50,81,82,83,113,114,115,116].includes(n)) return 'Post-transition metal';
      if ([5,14,32,33,51,52,84].includes(n)) return 'Metalloid';
      if ([1,6,7,8,15,16,34].includes(n)) return 'Nonmetal';
      if ([9,17,35,53,85,117].includes(n)) return 'Halogen';
      if ([2,10,18,36,54,86,118].includes(n)) return 'Noble gas';
      if (n >= 57 && n <= 71) return 'Lanthanide';
      if (n >= 89 && n <= 103) return 'Actinide';
      return 'Transition metal';
    }

    function formatNumber(value) {
      if (value === null || value === undefined) return '—';
      return Number.isInteger(value) ? String(value) : String(value);
    }

    closeDialog.addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      const rect = dialog.getBoundingClientRect();
      const inside = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
      if (!inside) dialog.close();
    });
  </script>
</body>
</html>
