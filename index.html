<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/background-gradient.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/description-box.css" />
    <link rel="stylesheet" href="styles/search-box.css" />
    <link rel="stylesheet" href="styles/site-preferences.css" />
    <title>Chemistry</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__content">
        <button class="site-header__action" type="button" data-action="language">English</button>
        <button class="site-header__action" type="button" data-action="theme">حالت تاریک</button>
      </div>
    </header>

    <main>
      <section class="description-box" aria-label="توضیحات">
        <div class="description-box__content">
          <p class="description-box__text" data-i18n="description">توضیحات صفحه در این قسمت قرار می‌گیرد.</p>
        </div>
      </section>

      <section class="search-box" aria-label="جستجو">
        <div class="search-box__content">
          <label class="search-box__label" for="search-input" data-i18n="search-label">جستجو</label>
          <input class="search-box__input" id="search-input" type="search" data-i18n="search-placeholder" placeholder="عبارت مورد نظر را وارد کنید" />
          <button class="search-box__button" type="button" data-i18n="search-button">جستجو</button>
        </div>
      </section>
    </main>

    <script src="scripts/site-preferences.js"></script>
  </body>
</html>
