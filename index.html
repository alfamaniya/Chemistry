<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/background-gradient.css" />
    <link rel="stylesheet" href="styles/bidi.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/description-box.css" />
    <link rel="stylesheet" href="styles/search-box.css" />
    <link rel="stylesheet" href="styles/information-boxes.css" />
    <link rel="stylesheet" href="styles/site-preferences.css" />
    <title>Chemistry</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__content">
        <button class="site-header__action" type="button" data-action="language">English</button>
        <button class="site-header__action" type="button" data-action="theme">حالت تاریک</button>
      </div>
    </header>

    <main>
      <section class="description-box" aria-label="توضیحات" data-i18n-aria-label="descriptionAria">
        <div class="description-box__content">
          <p class="description-box__text bidi-text" data-i18n="description">توضیحات صفحه در این قسمت قرار می‌گیرد.</p>
        </div>
      </section>

      <section class="search-box" aria-label="جستجو" data-i18n-aria-label="searchAria">
        <div class="search-box__content">
          <label class="search-box__label" for="search-input" data-i18n="search">جستجو</label>
          <input class="search-box__input bidi-text" id="search-input" type="search" data-i18n="searchPlaceholder" placeholder="عبارت مورد نظر را وارد کنید" />
          <button class="search-box__button" type="button" data-i18n="search">جستجو</button>
        </div>
      </section>

      <section class="information-box information-box--basic" aria-label="اطلاعات پایه" data-i18n-aria-label="basicInformationAria">
        <div class="information-box__content">
          <h2 class="information-box__title" data-i18n="basicInformationTitle">اطلاعات پایه</h2>
          <div class="information-box__body" data-i18n="basicInformationPlaceholder">اطلاعات پایه در این قسمت نمایش داده خواهد شد.</div>
        </div>
      </section>

      <section class="information-box information-box--advanced" aria-label="اطلاعات پیشرفته" data-i18n-aria-label="advancedInformationAria">
        <div class="information-box__content">
          <h2 class="information-box__title" data-i18n="advancedInformationTitle">اطلاعات پیشرفته</h2>
          <div class="information-box__body" data-i18n="advancedInformationPlaceholder">اطلاعات پیشرفته در این قسمت نمایش داده خواهد شد.</div>
        </div>
      </section>

      <section class="information-box information-box--professional" aria-label="اطلاعات حرفه‌ای" data-i18n-aria-label="professionalInformationAria">
        <div class="information-box__content">
          <h2 class="information-box__title" data-i18n="professionalInformationTitle">اطلاعات حرفه‌ای</h2>
          <div class="information-box__body" data-i18n="professionalInformationPlaceholder">اطلاعات حرفه‌ای در این قسمت نمایش داده خواهد شد.</div>
        </div>
      </section>
    </main>

    <script src="scripts/site-preferences.js"></script>
  </body>
</html>
